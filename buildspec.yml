version: 0.2

phases:
  install:
    commands:
      - echo Restoring NuGet packages
      - nuget restore FBZapp.sln

  build:
    commands:
      - echo Cleaning publish folder
      - if exist published_site rmdir /s /q published_site
      - mkdir published_site
      - echo Publishing MVC web application
      - msbuild FBZapp.Mvc\FBZapp.Mvc.csproj /p:Configuration=Release /p:DeployOnBuild=true /p:WebPublishMethod=FileSystem /p:DeleteExistingFiles=True /p:publishUrl=..\published_site
      - echo Publish completed successfully

artifacts:
  base-directory: published_site
  files:
    - '**/*'
