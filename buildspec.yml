version: 0.2

phases:
  install:
    commands:
      - echo Restoring NuGet packages
      - nuget restore .\FBZapp.sln

  build:
    commands:
      - echo Cleaning publish folder
      - if (Test-Path "$env:CODEBUILD_SRC_DIR\published_site") { Remove-Item -Recurse -Force "$env:CODEBUILD_SRC_DIR\published_site" }
      - New-Item -ItemType Directory -Force -Path "$env:CODEBUILD_SRC_DIR\published_site"
      - echo Publishing MVC web application
      - msbuild .\FBZapp.Mvc\FBZapp.Mvc.csproj /p:Configuration=Release /p:DeployOnBuild=true /p:WebPublishMethod=FileSystem /p:DeleteExistingFiles=True /p:publishUrl="$env:CODEBUILD_SRC_DIR\published_site"
      - echo Listing published files
      - Get-ChildItem "$env:CODEBUILD_SRC_DIR\published_site" -Recurse

artifacts:
  files:
    - '**/*'
  base-directory: published_site
