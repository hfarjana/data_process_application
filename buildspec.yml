version: 0.2

phases:
  install:
    commands:
      - echo Restoring NuGet packages
      - nuget restore FBZapp.sln

  build:
    commands:
      - echo Building MVC web application
      - msbuild FBZapp.Mvc/FBZapp.Mvc.csproj /p:Configuration=Release
      - echo Build completed successfully

artifacts:
  files:
    - '**/*'
